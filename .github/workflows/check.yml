# Runs `make check` on a macOS runner with Xcode 27.
#
# Triggers follow P0.10's recommendation (a working default until the owner
# decides): by hand at any time, and on pushes to main only while the
# repository is public. Hosted macOS minutes are free for public repositories
# and billed for private ones (D11), so on a private repository the push run
# is skipped before it starts a runner.
name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A running check finishes; only the newest waiting push runs after it (older waiting
# runs are replaced), so frequent pushes to main still get a completed check.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    # GitHub's dedicated Xcode 27 image, as on Beautiful Corner.
    # https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          xcode=$(find /Applications -maxdepth 1 -name "Xcode_27*.app" | sort | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select --switch "$xcode"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show the simulator
        run: |
          xcrun simctl list devices available
          echo "Using $(scripts/sim-destination.sh)"

      - name: make check
        run: make check

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: build/*.xcresult
          retention-days: 7
