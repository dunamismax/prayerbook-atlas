# Every interface string of the site (BUILD.md P2.13), in English only for
# now. Views use lazy lookups (t(".key")) where the string belongs to one
# template, and the shared keys below where several use it. A test finds
# literal text left in views (test/lib/untranslated_text_test.rb).
#
# Prayer-book text never comes from here: it is transcribed, sourced content
# (AGENTS.md §6). These are the site's own words.

en:
  date:
    formats:
      day: "%-d %B %Y"
      month: "%B %Y"

  site:
    name: "Prayerbook Atlas"
    tagline: "the books of common prayer"
    description: "Common prayer from the Books of Common Prayer, each book on its own terms."
    skip_link: "Skip to the text"
    tools: "Tools"
    settings: "Settings"
    sections: "Sections"
    in_this_section: "In this section"
    margin: "Margin"
    notes_and_sources: "Notes and sources"
    not_ready: "This site is being built. Nothing here is ready for prayer yet, and no prayer-book text has been added: every text will be transcribed from an identified printing and proofread before it appears."

  sections:
    placeholder:
      eyebrow_today: "prayerbook atlas"
      eyebrow_section: "section"
      planned: "planned"
      what_will_be_here: "What will be here"
    first_visit:
      eyebrow: "welcome"
      title: "Which prayer book does your church use?"
      intro_html: "The site follows one book at a time, on its own terms. Choose yours, or skip this and begin with 1662; you can change it at any time in %{settings}."
      use_this_book: "Use this book"
      skip: "Skip for now"
    today:
      title: "Today"
      summary: "The day in the Church's year and the office for the hour, from your prayer book."
      planned:
        - "The day's name in your prayer book, with the other books' names beside it."
        - "The office for the hour, with its psalms, lessons, canticles, and collect in place."
        - "Holy days, fasts, and the season, each in the book's own words."
        - "Your rule of life and reading-plan portion, kept in your browser and never graded."
      your_book: "Your prayer book"
      change_it: "Change it in Settings"
      the_books: "The books"
      the_books_note: "The first books will be the three in the public domain in the United States: the Church of England's 1662, and the American 1928 and 1979. Others follow as permission allows."
    pray:
      title: "Pray"
      summary: "The offices, the Litany, prayers and thanksgivings, Holy Communion, and the pastoral offices."
      planned:
        - "Morning and Evening Prayer, Noonday Prayer, and Compline, from each book that has them."
        - "The Litany, the prayers and thanksgivings, and the collects."
        - "Holy Communion and the pastoral offices, to follow along and to prepare."
        - "Intercessions and preparation for confession, kept in your browser only."
    bible:
      title: "Bible"
      summary: "Holy Scripture, the day's lessons, each book's Psalter, the lectionaries, and reading plans."
      planned:
        - "The King James Version with the Apocrypha and the World English Bible, each labeled."
        - "Each prayer book's own Psalter, in its own cycle."
        - "The day's lessons from every lectionary the books appoint."
        - "Gentle reading plans, with no streaks and no scores."
    kalendar:
      title: "Kalendar"
      summary: "The Christian year by month and year: holy days, commemorations, fasts, and the Easter tables."
      planned:
        - "Month and year views, with red-letter days marked in words and symbols, never colour alone."
        - "Holy days, commemorations, fasts, and Ember and Rogation days, by each book's rules."
        - "Easter and the moveable feasts for any year, with the 1662 book's own tables explained."
        - "Calendar subscriptions of each book's holy days."
      the_word: "The word"
      the_word_note: "\"Kalendar\" is the prayer books' own spelling for the table of the Church's year."
    atlas:
      title: "Atlas"
      summary: "The prayer books themselves: each book's page, any prayer compared across books, and their lineage."
      planned:
        - "A page for each prayer book: who authorized it, where it is used, and which printing the site follows."
        - "Any prayer compared across the books that have it, side by side, with the differences marked."
        - "\"Where is this prayer?\": every book's witness to a prayer, or a plain note of its absence."
        - "A sourced map of how the books descend from Cranmer's 1549 and 1552."
      compare: "Compare"
      compare_note: "On the full site, up to three books stand side by side. On the phone site, two at a time, one above the other."

  prayer_books:
