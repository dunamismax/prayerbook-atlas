# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# The content database is compiled from content/ by `bin/rails content:compile`
# and opened read-only; Rails' database tasks never touch it (BUILD.md P3.7).
content: &content
  <<: *default
  readonly: true
  database_tasks: false
  pragmas:
    journal_mode: delete

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  content:
    <<: *content
    database: db/content.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/test.sqlite3
  # Compiled from test/fixtures/files/content when the tests start.
  content:
    <<: *content
    database: tmp/content-test.sqlite3

# In production storage/ is a link to the server's shared storage directory,
# which outlives each release and is what the nightly backup copies
# (docs/deploy.md, BUILD.md P5.5).
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
  content:
    <<: *content
    database: db/content.sqlite3
